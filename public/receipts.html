<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnote, receipts sent</title>
<link rel="stylesheet" href="/style.css">
<style>.wrap{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}.wrap h1{font-size:44px;grid-column:1/-1}ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}li{padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}li:first-child{border-top:0}li.on{background:var(--plum-soft)}li b{display:block;font-weight:600;font-size:15px}li span{color:var(--muted);font-size:14px}.mail{background:#EDEBE5;border-radius:10px;padding:28px}.mail .meta{font-size:14px;color:var(--muted);margin-bottom:14px}.empty{color:var(--muted)}@media(max-width:760px){.wrap{grid-template-columns:1fr}}</style></head>
<body>
<header class="top"><div class="in"><a class="brand" href="/">Fieldnote</a><nav><a href="/">Plans</a><a href="/invoices.html">Invoices</a><a href="/receipts.html" class="on">Receipts sent</a></nav></div></header>
<main><div class="wrap"><h1>Receipts sent</h1><ul id="list"></ul><div class="mail" id="mail"><p class="empty">No receipts yet. One is written each time the webhook confirms a payment.</p></div></div></main>
<p class="foot">Fictional business, invented data.</p>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
fetch("/api/outbox").then((r) => r.json()).then(({ emails }) => {
  const list = document.getElementById("list");
  list.hidden = !emails.length;
  list.innerHTML = emails.map((e, i) => `<li data-i="${i}"><b>${esc(e.to)}</b><span>${esc(e.subject)}</span></li>`).join("");
  const open = (i) => { list.querySelectorAll("li").forEach((li) => li.classList.toggle("on", li.dataset.i == i)); const e = emails[i]; document.getElementById("mail").innerHTML = `<p class="meta">To ${esc(e.to)}<br>Subject: ${esc(e.subject)}</p>${e.html}`; };
  list.addEventListener("click", (ev) => { const li = ev.target.closest("li"); if (li) open(li.dataset.i); });
  if (emails.length) open(0);
});
</script>
</body></html>
