<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | Fieldnote sample store</title>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/pages.css"></head>
<body>
<header class="bar">
  <a class="brand" href="/"><i>F</i>Fieldnote</a>
  <nav><span class="test">Sample store, Stripe test mode</span><a href="/">Pricing</a><a href="/orders.html" class="on">Orders</a></nav>
</header>
<main class="wide">
  <div class="head">
    <div><h1>Orders</h1><p class="muted">Every row is created at checkout and updated by the Stripe webhook. This page refreshes on its own.</p></div>
    <div class="stats">
      <div><strong id="revenue">$0</strong><span>collected</span></div>
      <div><strong id="subs">0</strong><span>subscribers</span></div>
      <div><strong id="count">0</strong><span>orders</span></div>
    </div>
  </div>
  <table>
    <thead><tr><th>Order</th><th>Customer</th><th>Type</th><th class="n">Amount</th><th>Status</th><th>Updated</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="muted small live"><span class="dot"></span>Live. Last checked <span id="checked">now</span>.</p>
</main>
<script src="/orders.js"></script>
</body></html>
