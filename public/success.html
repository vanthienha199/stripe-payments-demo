<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thank you | Fieldnote sample store</title>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/pages.css"></head>
<body>
<header class="bar">
  <a class="brand" href="/"><i>F</i>Fieldnote</a>
  <nav><span class="test">Sample store, Stripe test mode</span><a href="/">Pricing</a><a href="/orders.html">Orders</a></nav>
</header>
<main class="narrow">
  <div class="card receipt">
    <div class="check"></div>
    <h1>Payment received</h1>
    <p class="muted" id="sub">Thanks for your order. A receipt is on its way to your email.</p>
    <dl>
      <dt>Order</dt><dd id="product">Loading...</dd>
      <dt>Amount</dt><dd id="amount"></dd>
      <dt>Email</dt><dd id="email"></dd>
      <dt>Status</dt><dd><span class="pill pending" id="status">pending</span> <span class="muted small" id="wh">waiting for Stripe webhook</span></dd>
    </dl>
    <div class="row">
      <button class="btn" id="portal" hidden>Manage subscription</button>
      <a class="btn ghost" href="/orders.html">See all orders</a>
    </div>
  </div>
</main>
<script src="/success.js"></script>
</body></html>
